<div class="landing">
    <div class="card">
        <h1 class="title">{{ copy.title }}</h1>
        <p class="subtitle">{{ copy.subtitle }}</p>
        <input class="invite-input"
               type="text"
               [value]="code()"
               (input)="onInput($event)"/>

        @if (error()) {
            <p class="error">{{ error() }}</p>
        }
        <button class="btn btn-primary"
                [disabled]="!code().trim() || loading()"
                (click)="submit()">
            @if (loading()) {
              {{ copy.loadingButton }}
            } @else {
              {{ copy.submitButton }}
            }
        </button>
    </div>
</div>
