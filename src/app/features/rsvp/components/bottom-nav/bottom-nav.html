<nav class="bottom-nav">
    @for (item of items; track item.id) {
        <button (click)="scrollTo(item.id)" [class.active]="active() === item.id">
            @if (item.icon) {
                <lucide-icon [name]="item.icon"></lucide-icon>
            }
            @if (item.image) {
                <img [src]="item.image" [alt]="item.alt" width="24" height="24" />
            }
        </button>
    }
</nav>
