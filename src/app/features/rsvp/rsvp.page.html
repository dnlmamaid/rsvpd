<div class="page-shell">
  <div class="container">
    <section id="hero">
      <app-hero-section />
      <span class="section-footer-mark" aria-hidden="true"></span>
    </section>
    <section id="location">
      <app-location-section />
      <span class="section-footer-mark" aria-hidden="true"></span>
    </section>
    <section id="program">
      <app-program-section />
      <span class="section-footer-mark" aria-hidden="true"></span>
    </section>
    <section id="attire">
      <app-attire-section [invite]="invite()" />
      <span class="section-footer-mark" aria-hidden="true"></span>
    </section>
    <section id="faq">
      <app-faq-section />
      <span class="section-footer-mark" aria-hidden="true"></span>
    </section>
    <section id="rsvp">
      @if (loading()) {
        <p class="center">{{ loadingLabel }}</p>
      }
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      @if (invite(); as inviteData) {
        <app-rsvp-form
          [invite]="inviteData"
          (submitted)="onSubmitted()"
        />
      }
      <span class="section-footer-mark" aria-hidden="true"></span>
    </section>

    <section id="qr">
      <app-qr-section />
      <span class="section-footer-mark" aria-hidden="true"></span>
    </section>
    <section id="reminders">
      <app-reminders-section/>
      <span class="section-footer-mark" aria-hidden="true"></span>
    </section>
  </div>

  <app-bottom-nav />
</div>
