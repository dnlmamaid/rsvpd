<section class="faq">

  <h2 class="title">{{title}}</h2>

  <div class="faq-list">
    @for (faq of faqs(); track faq.question) {
      <div class="faq-item">
        <h3>{{ faq.question }}</h3>
        @for (answer of faq.answers; track answer) {
          <p>{{ answer }}</p>
        }
      </div>
    }

  </div>

</section>
