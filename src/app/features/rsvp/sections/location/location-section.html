<section class="location">
  <header class="location__header">
    <h2>{{ title() }}</h2>
  </header>

  <div class="location__venue-grid">
    @for (venue of venues(); track venue.name) {
      <article class="location__venue">
        <a
          class="location__image-link"
          [href]="venue.maps"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="getMapAriaLabel(venue)"
        >
          <img [src]="venue.image" [alt]="venue.name" />
        </a>

        <div class="location__caption">
          <div class="location__caption-main">
            <span>{{ venue.label }}</span>
            <h3>{{ venue.name }}</h3>
            <p>{{ venue.address }}</p>
          </div>

          <a
            class="location__map-link"
            [href]="venue.maps"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="getMapAriaLabel(venue)"
          >
            <lucide-icon [name]="mapIconName" [size]="mapIconSize" />
          </a>
        </div>
      </article>
    }
  </div>
</section>
